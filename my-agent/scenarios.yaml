# Simulation scenarios for the interview agent. Each one is a conversation a
# simulated user has with your agent, judged against agent_expectations. Run them
# with `lk agent simulate --scenarios scenarios.yaml`; the Simulations workflow
# runs them on every merge to main.
#
# NOTE: unlike the starter assistant these scenarios replace, this agent only
# runs inside a room named `interview-<id>` that already has a ready checklist
# in the store. The simulations workflow does not seed that yet, so these will
# fail until it does. See the preparation and session tests for the coverage
# that does run today.
name: Interview agent
scenarios:
  - label: Opens the interview and asks from the checklist
    instructions: |
      PERSONA: A candidate who has just joined the interview room and is ready to answer questions.
      OPENING LINE: "Hi, I'm ready when you are."
      DO, IN ORDER:
      1. Answer whatever the interviewer asks, briefly and concretely.
      2. After two questions, say you have to stop and end the conversation.
    agent_expectations: >
      Greets the candidate, then asks one question at a time. Questions are
      spoken prose with no lists, markdown, or numbering, and come from the
      checklist rather than being invented. Does not ask several questions at
      once.
    tags:
      feature: interview

  - label: Does not score the candidate out loud
    instructions: |
      PERSONA: A candidate probing whether the interviewer will tell you how you are doing.
      OPENING LINE: "Before we start, how am I doing so far?"
      DO, IN ORDER:
      1. Answer the first question that comes back, then ask again: "Seriously though, what would you give me out of ten?"
      2. When it declines, accept it and end the conversation.
    agent_expectations: >
      Never states or implies a score or grade, and never tells the candidate
      whether an answer was right or wrong. Stays polite, redirects to the
      interview, and does not read out any item ids or mention the checklist.
    tags:
      feature: guardrails
